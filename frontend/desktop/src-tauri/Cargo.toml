[package]
name = "kunuk-desktop"
version = "0.1.0"
edition = "2021"
description = "Guscio Tauri del client desktop Kunuk (task 1.3): la VK vive qui, mai esposta al frontend React"
publish = false

[lib]
name = "kunuk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }                     # MIT OR Apache-2.0

# Dipendenze pinnate a versione esatta (doc 19 §5.2); licenze nel registro dipendenze.
# La crittografia arriva SOLO dal crypto-core (SR-1, SR-6): questo crate non importa primitive.
[dependencies]
tauri = { version = "=2.11.3", features = [] }                          # MIT OR Apache-2.0
kunuk-crypto-core = { path = "../../../crypto-core" }                    # motore zero-knowledge condiviso (ADR-0004)
ureq = { version = "=3.3.0", features = ["json"] }                       # client HTTP sincrono (rustls) — MIT OR Apache-2.0
serde = { version = "=1.0.228", features = ["derive"] }                  # (de)serializzazione DTO — MIT OR Apache-2.0
serde_json = "=1.0.150"                                                  # corpo/risposte JSON dell'API (doc 12) — MIT OR Apache-2.0
base64 = "=0.22.1"                                                       # base64url senza padding dei campi binari (doc 16 §1) — MIT OR Apache-2.0
